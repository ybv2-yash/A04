<!DOCTYPE html>
<!-- Tells the browser this document is written in HTML5 -->
<html lang="en">
<!-- Opens the root element; lang="en" says the page is in English -->
<head>
    <!-- Opens the head: information about the page that is not displayed in the body -->
    <meta charset="UTF-8">
    <!-- Sets the character encoding so symbols like the copyright sign display correctly -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Makes the page scale properly on phones and small screens -->
    <title>My First Web Page</title>
    <!-- Text shown on the browser tab -->
    <style>
        /* Opens the CSS block that controls how the page looks */
        body {
            font-family: Arial, sans-serif; /* Sets the font for the whole page */
            max-width: 700px;               /* Keeps the text from stretching too wide */
            margin: 40px auto;              /* Centers the content horizontally */
            line-height: 1.6;               /* Adds space between lines for readability */
        }
        footer {
            margin-top: 40px;               /* Space above the footer */
            padding-top: 10px;              /* Space inside the footer above the text */
            border-top: 1px solid #999;     /* Thin line separating the footer */
            font-size: 0.9em;               /* Makes the footer text slightly smaller */
        }
    </style>
    <!-- Closes the CSS block -->
</head>
<!-- Closes the head -->
<body>
    <!-- Opens the body: everything the visitor sees -->
    <h1>Welcome to My First Web Page</h1>
    <!-- Main heading of the page -->
    <p><strong>Name:</strong> ybv2-yash</p>
    <!-- Paragraph showing my name/username; strong makes the label bold -->
    <p><strong>Course Name:</strong> Introduction to Website Development</p>
    <!-- Paragraph showing the course name -->
    <p><strong>Course Number:</strong> IS 117</p>
    <!-- Paragraph showing the course number -->
    <p><strong>Course Section:</strong> 003</p>
    <!-- Paragraph showing the course section -->
    <footer>
        <!-- Opens the footer section at the bottom of the page -->
        <p>&copy; ybv2-yash &ndash; October 6, 2026</p>
        <!-- &copy; displays the copyright symbol; then my name and the assignment due date -->
    </footer>
    <!-- Closes the footer -->
</body>
<!-- Closes the body -->
</html>
<!-- Closes the root html element -->
